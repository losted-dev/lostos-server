<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>lostOS</title>
  <!-- the same drawing as icon-512.png (make_icons.py), made of gradients only: no filters, so every browser and every program draws it alike -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181f"/><stop offset="1" stop-color="#020204"/></linearGradient>
    <radialGradient id="glow" cx="512" cy="905" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 905) scale(430 330) translate(-512 -905)"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".38"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="drop" cx="512" cy="560" r="380" gradientUnits="userSpaceOnUse"><stop offset=".7" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024"><stop offset="0" stop-color="#bea0ff"/><stop offset="1" stop-color="#461ea0"/></linearGradient>
    <radialGradient id="shine" cx="432" cy="370" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(432 370) scale(190 160) translate(-432 -370)"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".6" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".3" stop-color="#fff" stop-opacity=".9"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#drop)"/>
  <circle cx="512" cy="512" r="300" fill="url(#orb)"/>
  <circle cx="512" cy="512" r="300" fill="url(#shine)"/>
  <circle cx="512" cy="512" r="297" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <!-- the L: round ends, the inner corner softly rounded (r 30) -->
  <path d="M402 381A39 39 0 0 1 480 381V534A30 30 0 0 0 510 564H633A39 39 0 0 1 633 642H441A39 39 0 0 1 402 603Z" fill="#fff"/>
</svg>
